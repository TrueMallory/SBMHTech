<style>
/* Layout: full-bleed stage (3:2) with an inset rounded card; the halo behind each card is its own background blurred. Cards wipe left→right behind a curved glass column. Single look by choice. */
:root{
  --page:#0a0a0b;
  --chalk:#f4f4f2;
  --muted:#8a8a88;
  --line:#2a2a2c;
  --geo:"Poppins","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --heavy:"Archivo","Arial Black",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:transparent;color:var(--chalk);font-family:var(--geo);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding-block:0;
  padding-left:0;
  padding-right:0;
  box-sizing:border-box;
}
.wrap{width:min(1100px,100%);container-type:inline-size}
.stage{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;border-radius:14px;isolation:isolate;background:transparent;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage:active{cursor:grabbing}
.slide{position:absolute;inset:0;overflow:hidden}
.halo{display:none;position:absolute;inset:-12%;filter:blur(36px) brightness(.92);transform:scale(1.05)}
.card{
  position:absolute;left:1.4%;right:1.4%;top:9%;bottom:9%;
  border-radius:2.4cqw;overflow:hidden;
  box-shadow:0 1px 0 #ffffff1a inset, 0 20px 50px -25px #0008;
  display:flex;align-items:center;justify-content:center;
}
.bg{position:absolute;inset:0}
.content{position:relative;z-index:2;display:flex;align-items:center;gap:2.2cqw;white-space:nowrap}
.icon{width:9cqw;height:9cqw;flex:none;display:block}
.icon svg{width:100%;height:100%;display:block}
.title{font-size:7.6cqw;line-height:1;font-weight:600;letter-spacing:-.03em}
.ch{display:inline-block;white-space:pre}

/* glass column that rides the wipe */
.flare{position:absolute;top:0;bottom:0;width:11%;z-index:30;pointer-events:none;
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2)}
.flare .fill{position:absolute;inset:0;opacity:.9;filter:blur(4px);
  -webkit-mask:linear-gradient(90deg,#000 0 30%,#0000 75%);mask:linear-gradient(90deg,#000 0 30%,#0000 75%)}
.flare.rtl .fill{-webkit-mask:linear-gradient(270deg,#000 0 30%,#0000 75%);mask:linear-gradient(270deg,#000 0 30%,#0000 75%)}
.flare.rtl .gloss{transform:scaleX(-1)}
.flare .gloss{position:absolute;inset:0;
  background:linear-gradient(90deg,#ffffff40 0,#ffffff10 6%,#0000 14%,#00000030 26%,#0000 32%,#ffffff12 55%,#0000 80%)}

.bg.b9 ~ .tag{color:#fff;opacity:.95;text-shadow:0 1px 6px #0006}
/* card Design: painéis de vidro com borda iridescente */
.b12{
  --iri:conic-gradient(from 210deg,#ff7ab8,#ffffff 8%,#7aa8ff 16%,#5b2fd6 30%,#2a1450 45%,#8a5cff 58%,#ffffff 66%,#ff9a6a 74%,#7a5cff 88%,#ff7ab8);
  border:.35cqw solid #0000;border-radius:2.4cqw;box-sizing:border-box;
  background:radial-gradient(70% 80% at 50% 35%,#1a0a2c,#050208 75%) padding-box, var(--iri) border-box;
}
.b12::before,.b12::after{content:"";position:absolute;left:2.6%;right:2.6%;border-radius:3.2cqw;border:.32cqw solid #0000;
  background:radial-gradient(60% 70% at 50% 40%,#4a2272,#22103a 55%,#0b0512 100%) padding-box, var(--iri) border-box}
.b12::before{top:5%;height:58%;
  box-shadow:inset 0 0 2.4cqw #b48cff33, inset 0 -1.3cqw 1.1cqw -.5cqw #ffb3e0cc, inset 0 -2.4cqw 2cqw -1cqw #7aa8ff88, 0 .8cqw 2.4cqw #8a5cff55}
.b12::after{bottom:5%;height:22%;
  background:radial-gradient(70% 90% at 50% 70%,#2a1446,#120822 60%,#06030b) padding-box, var(--iri) border-box;
  box-shadow:inset 0 1.3cqw 1.1cqw -.5cqw #ffb3e0cc, inset 0 2.4cqw 2cqw -1cqw #7aa8ff88, 0 -.8cqw 2.4cqw #8a5cff55}
.card.design .content{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%)}
.card.design .tag{bottom:13.5%}
.f-mono{font-family:var(--mono);font-weight:800;letter-spacing:-.04em}
.f-heavy{font-family:var(--heavy);font-weight:900;letter-spacing:-.04em;font-size:8.6cqw}
.f-low{font-weight:600;letter-spacing:-.045em;font-size:8.2cqw}
.f-wide{font-weight:500;letter-spacing:.01em}
.f-two{font-size:5.4cqw;line-height:.95;letter-spacing:-.035em;white-space:normal}
.box{display:inline-block;width:.68em;height:.7em;background:#2ee68a;border-radius:.12em;vertical-align:-.02em;position:relative;margin-left:.03em}
.box::after{content:"";position:absolute;width:.22em;height:.22em;border-radius:50%;background:#030504;left:50%;top:50%;transform:translate(-50%,-50%)}

/* controls */
.bar{width:min(1100px,100%);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:22px;height:4px;border-radius:4px;border:0;padding:0;background:var(--line);cursor:pointer}
.dot[aria-selected="true"]{background:var(--chalk)}
.btns{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.count{min-width:58px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.08em}
.btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--chalk);display:grid;place-items:center;cursor:pointer}
.btn:hover{background:#ffffff0f}
.btn:focus-visible,.dot:focus-visible{outline:2px solid var(--chalk);outline-offset:3px}
.btn svg{width:14px;height:14px}
@container (max-width:560px){
  .stage{aspect-ratio:4/3}
  .title{font-size:9.4cqw}.f-heavy{font-size:10.4cqw}.f-low{font-size:10cqw}.f-two{font-size:7cqw}
  .icon{width:11cqw;height:11cqw}
  .icon.lg{width:42cqw;height:35.6cqw}.icon.md{width:13cqw;height:11cqw}
  .tag{font-size:11px}
}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap"><div class="stage" id="stage" aria-label="O que é a SBMH Tech"></div></div>
<div class="bar" hidden>
  <div class="dots" id="dots" role="tablist" aria-label="Cards"></div>
  <div class="btns">
    <button class="btn" id="prev" aria-label="Card anterior"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg></button>
    <span class="count" id="count">01 / 12</span>
    <button class="btn" id="play" aria-label="Pausar"><svg viewBox="0 0 16 16" fill="currentColor" id="playIcon"><rect x="4" y="3" width="3" height="10" rx="1"/><rect x="9" y="3" width="3" height="10" rx="1"/></svg></button>
    <button class="btn" id="next" aria-label="Próximo card"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 3 5 5-5 5"/></svg></button>
  </div>
</div>

<script>
let uid = 0;
const ICONS = {
  logo: () => `<span class="logo" role="img" aria-label="SBMH"></span>`,
  s: id => `<svg viewBox="0 0 48 48"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb070"/><stop offset="1" stop-color="#ff3b3b"/></linearGradient></defs><path d="M35 11H19a6.5 6.5 0 0 0 0 13h10a6.5 6.5 0 0 1 0 13H13" fill="none" stroke="url(#${id})" stroke-width="6.5" stroke-linecap="round"/></svg>`,
  pen: id => `<svg viewBox="0 0 48 48"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3e0"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#8aa8ff"/></linearGradient></defs><path d="M24 4 36 22 24 44 12 22z" fill="none" stroke="url(#${id})" stroke-width="3.4" stroke-linejoin="round"/><circle cx="24" cy="25" r="3.6" fill="url(#${id})"/><path d="M24 4v17" stroke="url(#${id})" stroke-width="3"/></svg>`,
  phone: () => `<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.6"><rect x="13" y="4" width="22" height="40" rx="6"/><path d="M21 37h6" stroke-linecap="round"/></svg>`,
  cube: id => `<svg viewBox="0 0 48 48"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b48cff"/><stop offset="1" stop-color="#6a3df0"/></linearGradient></defs><path d="M24 4 42 14v20L24 44 6 34V14z" fill="url(#${id})"/><path d="M24 24 42 14v20L24 44z" fill="#4b22c9" fill-opacity=".55"/><path d="M24 24 6 14 24 4l18 10z" fill="#fff" fill-opacity=".25"/></svg>`,
  bolt: () => `<svg viewBox="0 0 48 48" fill="none" stroke="#3ef08a" stroke-width="3" stroke-linejoin="round"><path d="M27 4 10 27h12l-3 17 19-25H26z"/><path d="M27 10 15 26h10l-2 11" opacity=".5"/></svg>`,
  code: () => `<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 13 5 24l11 11M32 13l11 11-11 11M27 8l-6 32"/></svg>`,
  stripes: id => `<svg viewBox="0 0 48 48"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7b3df5"/><stop offset="1" stop-color="#f05a9a"/></linearGradient></defs><g fill="none" stroke="url(#${id})" stroke-width="5" stroke-linecap="round"><path d="M10 40 22 8"/><path d="M20 40 32 8"/><path d="M30 40c6-2 11-8 11-16a16 16 0 0 0-9-14"/></g></svg>`,
  pin: id => `<svg viewBox="0 0 48 48"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fbf6a"/><stop offset="1" stop-color="#1f6b35"/></linearGradient></defs><path d="M24 3c9 0 16 7 16 16 0 11-16 26-16 26S8 30 8 19C8 10 15 3 24 3z" fill="url(#${id})"/><circle cx="24" cy="19" r="6" fill="#eaf7e4"/></svg>`,
  shield: () => `<svg viewBox="0 0 48 48"><path d="M24 4 41 10v13c0 11-7 18-17 21C14 41 7 34 7 23V10z" fill="#fff"/><path d="M15 30 30 12M20 35l16-19M13 22l9-11" stroke="#2559f0" stroke-width="3.2" stroke-linecap="round"/></svg>`
};

const CARDS = [
  {bg:'b1', fg:'#fff', icon:'logo', size:'lg', title:[], tag:'Developing Solutions'},
  {bg:'b2', fg:'#121212', font:'f-mono', title:['Sob medida'], tag:'Sistemas feitos pra rotina da sua empresa', morph:true},
  {bg:'b3', fg:'#fff', icon:'phone', title:['Apps mobile'], tag:'Android e iOS, do zero à publicação na loja'},
  {bg:'b12', fg:'#fff', icon:'pen', layout:'design', title:['Design'], tag:'UI/UX de apps e sistemas, pensado pro seu usuário'},
  {bg:'b4', fg:'#21104d', icon:'cube', font:'f-low', title:['gestão'], tag:'Sistemas de gestão e dashboards'},
  {bg:'b5', fg:'#fff', icon:'bolt', font:'f-wide', title:['AUTOMAÇÃO'], tag:'Bots, integrações e rotinas no automático'},
  {bg:'b6', fg:'#fff', icon:'code', title:['Código seu'], tag:'No fim do projeto, o código-fonte é entregue a você'},
  {bg:'b7', fg:'#1c1a2b', icon:'stripes', title:['Transparência'], tag:'Escopo, prazo e investimento por escrito'},
  {bg:'b8', fg:'#fff', font:'f-heavy', title:['Remot',{html:'<span class="box"></span>'}], tag:'Atendimento 100% remoto em todo o Brasil'},
  {bg:'b9', fg:'#1a5a2b', icon:'pin', font:'f-two', title:['Feito em',{html:'<br>'},'Manaus'], tag:'Daqui pra qualquer cidade do país'},
  {bg:'b10', fg:'#fff', icon:'shield', font:'', title:['Suporte'], tag:'A gente continua com você depois da entrega', bold:true},
  {bg:'b11', fg:'#111', icon:'logo', size:'md', title:['@sbmhtech'], tag:'Bora tirar seu sistema do papel?'}
];

const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots'), countEl = document.getElementById('count');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const HOLD = 2600, WIPE = 900;
const pad = n => String(n).padStart(2,'0');

/* glass column outline: full-height column on the left, fillets into the card's top & bottom */
const FLARE_POLY = (()=>{
  const c=30, t=9, pts=[];
  const bez=(p0,p1,p2,p3,s)=>{const u=1-s;return u*u*u*p0+3*u*u*s*p1+3*u*s*s*p2+s*s*s*p3};
  pts.push([0,0]);
  for(let i=0;i<=14;i++){const s=i/14; pts.push([bez(c,c,c+14,100,s), bez(0,t*.85,t,t,s)]);}
  for(let i=14;i>=0;i--){const s=i/14; pts.push([bez(c,c,c+14,100,s), 100-bez(0,t*.85,t,t,s)]);}
  pts.push([0,100]);
  return `polygon(${pts.map(([x,y])=>`${x.toFixed(2)}% ${y.toFixed(2)}%`).join(',')})`;
})();

function build(c){
  const s = document.createElement('div');
  s.className='slide';
  let units = '';
  if(c.icon){ units += `<span class="ch icon ${c.size||''}">${ICONS[c.icon]('g'+(uid++))}</span>`; }
  let t = '';
  c.title.forEach(tok=>{
    if(typeof tok==='string') t += [...tok].map(ch=>`<span class="ch">${ch}</span>`).join('');
    else t += tok.html==='<br>' ? '<br>' : `<span class="ch">${tok.html}</span>`;
  });
  const label = c.title.map(x=>typeof x==='string'?x:(x.html==='<br>'?' ':'o')).join('');
  s.innerHTML = `<div class="halo ${c.bg}"></div>
    <div class="card ${c.layout||''}" style="color:${c.fg}">
      <div class="bg ${c.bg}"></div>
      <div class="content">${units}<span class="title ${c.font||''}" style="${c.bold?'font-weight:700':''}" aria-label="${label}">${t}</span></div>
      <div class="tag">${c.tag}</div>
    </div>`;
  return s;
}

/* ---------- transição controlada por progresso (auto, setas ou dedo) ---------- */
const FLARE_POLY_R = FLARE_POLY.replace(/(-?[\d.]+)% (-?[\d.]+)%/g,(m,x,y)=>`${(100-parseFloat(x)).toFixed(2)}% ${y}%`);
const RESUME = 6000;              // autoplay volta depois de 6s sem toque
const easeInOut = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeOut = t => 1-Math.pow(1-t,3);

function units(slide){ return [...slide.querySelectorAll('.content .ch, .tag')]; }
function measure(slide){
  const r0 = stage.getBoundingClientRect();
  return units(slide).map(el=>{
    const r = el.getBoundingClientRect();
    if(!el.dataset.op) el.dataset.op = getComputedStyle(el).opacity;
    return {el, cx:r.left + r.width/2 - r0.left, op:parseFloat(el.dataset.op)};
  });
}
function look(u, s){            // s: 0 = desfocado, 1 = nítido
  const k = 1-s, el = u.el;
  if(s>=.999){ el.style.filter=''; el.style.opacity=''; el.style.textShadow=''; return; }
  el.style.filter = `blur(${(k*12).toFixed(2)}px)`;
  el.style.opacity = (u.op*(.3+.7*s)).toFixed(3);
  el.style.textShadow = `${(-.07*k).toFixed(3)}em 0 #ff2a6dcc, ${(.07*k).toFixed(3)}em 0 #22d3ffcc`;
}
const clamp = v => Math.max(0, Math.min(1, v));

/* cria a transição: side 'ltr' = a borda anda da esquerda pra direita, 'rtl' = da direita pra esquerda */
function makeTransition(oldS, newS, oldIdx, side){
  const W = stage.clientWidth;
  if(oldS) stage.insertBefore(newS, oldS); else stage.appendChild(newS);
  let flare = null, F = 0;
  if(oldS && !reduce){
    flare = document.createElement('div');
    flare.className = 'flare' + (side==='rtl' ? ' rtl' : '');
    flare.style.clipPath = side==='rtl' ? FLARE_POLY_R : FLARE_POLY;
    flare.innerHTML = `<div class="fill ${CARDS[oldIdx].bg}"></div><div class="gloss"></div>`;
    oldS.appendChild(flare);
    F = flare.offsetWidth;
  }
  const nu = measure(newS), ou = oldS ? measure(oldS) : [];
  const BN = W*0.2, BO = W*0.38;
  const T = {p:0, side,
    render(p){
      T.p = p;
      if(reduce){ if(oldS) oldS.style.opacity = 1-p; return; }
      const x = side==='ltr' ? -F*0.3 + (W + F*0.6)*p : W + F*0.3 - (W + F*0.6)*p;
      if(oldS){
        if(side==='ltr'){ oldS.style.clipPath = `inset(0 0 0 ${Math.max(0,x)}px)`; flare.style.left = x+'px'; }
        else            { oldS.style.clipPath = `inset(0 ${Math.max(0,W-x)}px 0 0)`; flare.style.left = (x-F)+'px'; }
      }
      nu.forEach(u=>look(u, clamp(side==='ltr' ? (x-u.cx)/BN : (u.cx-x)/BN)));
      ou.forEach(u=>look(u, clamp(side==='ltr' ? (u.cx-x)/BO : (x-u.cx)/BO)));
    },
    finish(){ if(oldS) oldS.remove(); nu.forEach(u=>look(u,1)); },
    cancel(){ newS.remove(); if(oldS){ oldS.style.clipPath=''; oldS.style.opacity=''; flare && flare.remove(); } ou.forEach(u=>look(u,1)); }
  };
  T.render(0);
  return T;
}
function tween(T, to, dur, ez){
  return new Promise(res=>{
    const from = T.p, t0 = performance.now();
    const step = now=>{
      const k = Math.min(1,(now-t0)/dur);
      T.render(from + (to-from)*ez(k));
      k<1 ? requestAnimationFrame(step) : res();
    };
    requestAnimationFrame(step);
  });
}

function morph(slide){
  const t = slide.querySelector('.title.f-mono');
  if(!t || reduce) return;
  t.animate([{fontWeight:800},{fontWeight:800, offset:.25},{fontWeight:200}],
    {duration:HOLD, delay:WIPE*0.6, easing:'cubic-bezier(.6,0,.3,1)', fill:'forwards'});
}

const dots = CARDS.map((_,i)=>{
  const b=document.createElement('button'); b.className='dot'; b.setAttribute('role','tab');
  b.setAttribute('aria-label',`Card ${i+1}`); b.onclick=()=>go(i, i>idx?'rtl':'ltr'); dotsEl.appendChild(b); return b;
});
function ui(){
  countEl.textContent = `${pad(idx+1)} / ${pad(CARDS.length)}`;
  dots.forEach((d,i)=>d.setAttribute('aria-selected', i===idx));
}

let idx=0, cur=null, busy=false, playing=true, tHold=null, tResume=null;
const wrapIdx = n => (n+CARDS.length)%CARDS.length;

async function go(n, side='ltr'){
  n = wrapIdx(n);
  if(busy || (cur && n===idx)) return;
  clearTimeout(tHold);
  const next = build(CARDS[n]);
  busy = true;
  if(!cur){
    stage.appendChild(next); cur = next; idx = n; ui();
    const T = makeTransition(null, next, null, 'ltr');
    morph(next);
    await tween(T, 1, 900, easeOut); T.finish();
    busy = false; schedule(); return;
  }
  const T = makeTransition(cur, next, idx, side);
  idx = n; cur = next; ui(); morph(next);
  await tween(T, 1, WIPE, easeInOut); T.finish();
  busy = false; schedule();
}
function schedule(){
  clearTimeout(tHold);
  if(playing) tHold = setTimeout(()=>go(idx+1,'ltr'), HOLD);
}
function holdOff(){                 // pausa enquanto a pessoa mexe, volta sozinho depois
  clearTimeout(tHold); clearTimeout(tResume);
  if(playing) tResume = setTimeout(schedule, RESUME);
}

/* ---------- arrastar com o dedo (ou mouse) ---------- */
let drag = null, moved = false;
stage.addEventListener('pointerdown', e=>{
  if(busy || e.button>0) return;
  drag = {x0:e.clientX, y0:e.clientY, id:e.pointerId, T:null, side:null, target:0, shown:0, hist:[], raf:0};
  moved = false;
});
stage.addEventListener('pointermove', e=>{
  if(!drag || e.pointerId!==drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if(!drag.T){
    if(Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy)*1.2){ if(Math.abs(dy)>14) drag=null; return; }
    // dedo pra esquerda = próximo card entrando pela direita; dedo pra direita = card anterior entrando pela esquerda
    drag.side = dx < 0 ? 'rtl' : 'ltr';
    const n = wrapIdx(idx + (dx < 0 ? 1 : -1));
    holdOff(); busy = true; moved = true;
    stage.setPointerCapture(e.pointerId);
    drag.n = n; drag.newS = build(CARDS[n]);
    drag.T = makeTransition(cur, drag.newS, idx, drag.side);
    const loop = ()=>{                       // suaviza: o card persegue o dedo
      drag.shown += (drag.target - drag.shown)*0.28;
      drag.T.render(drag.shown);
      drag.raf = requestAnimationFrame(loop);
    };
    drag.raf = requestAnimationFrame(loop);
  }
  const W = stage.clientWidth;
  const dist = drag.side==='rtl' ? -dx : dx;
  drag.target = clamp(dist / (W*0.85));
  drag.hist.push({t:performance.now(), d:dist}); if(drag.hist.length>6) drag.hist.shift();
});
async function release(e){
  if(!drag || e.pointerId!==drag.id) return;
  const d = drag; drag = null;
  if(!d.T){ return; }
  cancelAnimationFrame(d.raf);
  const h = d.hist, v = h.length>1 ? (h[h.length-1].d - h[0].d) / Math.max(1, h[h.length-1].t - h[0].t) : 0;
  const commit = d.shown > 0.3 || v > 0.45;
  if(commit){
    idx = d.n; cur = d.newS; ui(); morph(cur);
    await tween(d.T, 1, 260 + 520*(1-d.shown), easeOut); d.T.finish();
  } else {
    await tween(d.T, 0, 200 + 400*d.shown, easeOut); d.T.cancel();
  }
  busy = false; holdOff();
}
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);

document.getElementById('next').onclick=()=>{ holdOff(); go(idx+1,'rtl'); };
document.getElementById('prev').onclick=()=>{ holdOff(); go(idx-1,'ltr'); };
const playBtn=document.getElementById('play'), playIcon=document.getElementById('playIcon');
playBtn.onclick=()=>{
  playing=!playing;
  playBtn.setAttribute('aria-label', playing?'Pausar':'Reproduzir');
  playIcon.innerHTML = playing
    ? '<rect x="4" y="3" width="3" height="10" rx="1"/><rect x="9" y="3" width="3" height="10" rx="1"/>'
    : '<path d="M5 3.5v9a.5.5 0 0 0 .77.42l7-4.5a.5.5 0 0 0 0-.84l-7-4.5A.5.5 0 0 0 5 3.5z"/>';
  clearTimeout(tResume);
  playing ? schedule() : clearTimeout(tHold);
};
stage.addEventListener('click',()=>{ if(!moved) playBtn.click(); moved=false; });
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){ holdOff(); go(idx+1,'rtl'); }
  if(e.key==='ArrowLeft'){ holdOff(); go(idx-1,'ltr'); }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden){clearTimeout(tHold);clearTimeout(tResume);} else if(!busy) schedule(); });

go(0);
</script>
</body>
</html>
